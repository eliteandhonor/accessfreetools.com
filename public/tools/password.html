<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator – AccessFreeTools</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>AccessFreeTools<span class="tld">.com</span></h1>
  </header>
  <main class="tool-page">
    <a class="back-link" href="/">&larr; All tools</a>
    <h2>🔑 Password Generator</h2>
    <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem;">
      <label>Length: <input type="number" id="length" value="16" min="4" max="128" style="width:70px;" /></label>
      <label><input type="checkbox" id="upper" checked /> Uppercase</label>
      <label><input type="checkbox" id="lower" checked /> Lowercase</label>
      <label><input type="checkbox" id="digits" checked /> Digits</label>
      <label><input type="checkbox" id="symbols" /> Symbols</label>
    </div>
    <div class="btn-row">
      <button id="generateBtn">Generate</button>
      <button id="copyBtn">Copy</button>
    </div>
    <div class="output" style="margin-top:.75rem;">
      <input type="text" id="output" readonly placeholder="Generated password…" style="font-family:monospace;font-size:1.05rem;" />
    </div>
  </main>
  <script>
    function generate() {
      const len     = parseInt(document.getElementById('length').value, 10) || 16;
      const upper   = document.getElementById('upper').checked   ? 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' : '';
      const lower   = document.getElementById('lower').checked   ? 'abcdefghijklmnopqrstuvwxyz' : '';
      const digits  = document.getElementById('digits').checked  ? '0123456789' : '';
      const symbols = document.getElementById('symbols').checked ? '!@#$%^&*()-_=+[]{}|;:,.<>?' : '';
      const charset = upper + lower + digits + symbols;
      if (!charset) { alert('Select at least one character type.'); return; }
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      document.getElementById('output').value = Array.from(arr, (n) => charset[n % charset.length]).join('');
    }
    document.getElementById('generateBtn').addEventListener('click', generate);
    document.getElementById('copyBtn').addEventListener('click', () =>
      navigator.clipboard.writeText(document.getElementById('output').value));
    generate();
  </script>
</body>
</html>
