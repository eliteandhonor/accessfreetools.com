<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Counter – AccessFreeTools</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>AccessFreeTools<span class="tld">.com</span></h1>
  </header>
  <main class="tool-page">
    <a class="back-link" href="/">&larr; All tools</a>
    <h2>📝 Word Counter</h2>
    <textarea id="input" rows="10" placeholder="Paste or type your text here…"></textarea>
    <div id="stats" style="margin-top:.9rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem;"></div>
  </main>
  <script>
    const input = document.getElementById('input');
    const stats = document.getElementById('stats');
    function update() {
      const text  = input.value;
      const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
      const rows = [
        ['Characters',    text.length],
        ['Characters (no spaces)', text.replace(/\s/g, '').length],
        ['Words',         words],
        ['Lines',         text === '' ? 0 : text.split('\n').length],
        ['Sentences',     (text.match(/[.!?]+/g) || []).length],
        ['Paragraphs',    text === '' ? 0 : text.split(/\n\s*\n/).filter(Boolean).length],
      ];
      stats.innerHTML = rows.map(([label, value]) =>
        `<div style="background:#fff;border-radius:8px;padding:.7rem 1rem;box-shadow:0 1px 4px rgba(0,0,0,.08);">
           <div style="font-size:1.4rem;font-weight:700;">${value}</div>
           <div style="font-size:.8rem;color:#6b7280;">${label}</div>
         </div>`
      ).join('');
    }
    input.addEventListener('input', update);
    update();
  </script>
</body>
</html>
