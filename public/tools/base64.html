<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base64 Encoder / Decoder – AccessFreeTools</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>AccessFreeTools<span class="tld">.com</span></h1>
  </header>
  <main class="tool-page">
    <a class="back-link" href="/">&larr; All tools</a>
    <h2>🔐 Base64 Encoder / Decoder</h2>
    <textarea id="input" rows="6" placeholder="Enter text or Base64 string…"></textarea>
    <div class="btn-row">
      <button id="encodeBtn">Encode</button>
      <button id="decodeBtn">Decode</button>
      <button id="copyBtn">Copy result</button>
      <button id="clearBtn">Clear</button>
    </div>
    <div class="output">
      <textarea id="output" rows="6" readonly placeholder="Result will appear here…"></textarea>
    </div>
  </main>
  <script>
    const input  = document.getElementById('input');
    const output = document.getElementById('output');
    document.getElementById('encodeBtn').addEventListener('click', () => {
      try { output.value = btoa(unescape(encodeURIComponent(input.value))); }
      catch { output.value = 'Error: unable to encode input.'; }
    });
    document.getElementById('decodeBtn').addEventListener('click', () => {
      try { output.value = decodeURIComponent(escape(atob(input.value.trim()))); }
      catch { output.value = 'Error: invalid Base64 input.'; }
    });
    document.getElementById('copyBtn').addEventListener('click', () => navigator.clipboard.writeText(output.value));
    document.getElementById('clearBtn').addEventListener('click', () => { input.value = ''; output.value = ''; });
  </script>
</body>
</html>
