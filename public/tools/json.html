<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Formatter – AccessFreeTools</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>AccessFreeTools<span class="tld">.com</span></h1>
  </header>
  <main class="tool-page">
    <a class="back-link" href="/">&larr; All tools</a>
    <h2>{ } JSON Formatter</h2>
    <textarea id="input" rows="8" placeholder="Paste raw JSON here…"></textarea>
    <div class="btn-row">
      <button id="formatBtn">Format</button>
      <button id="minifyBtn">Minify</button>
      <button id="copyBtn">Copy result</button>
      <button id="clearBtn">Clear</button>
    </div>
    <div class="output">
      <textarea id="output" rows="8" readonly placeholder="Result will appear here…"></textarea>
    </div>
  </main>
  <script>
    const input  = document.getElementById('input');
    const output = document.getElementById('output');
    document.getElementById('formatBtn').addEventListener('click', () => {
      try { output.value = JSON.stringify(JSON.parse(input.value), null, 2); }
      catch (e) { output.value = 'Error: ' + e.message; }
    });
    document.getElementById('minifyBtn').addEventListener('click', () => {
      try { output.value = JSON.stringify(JSON.parse(input.value)); }
      catch (e) { output.value = 'Error: ' + e.message; }
    });
    document.getElementById('copyBtn').addEventListener('click', () => navigator.clipboard.writeText(output.value));
    document.getElementById('clearBtn').addEventListener('click', () => { input.value = ''; output.value = ''; });
  </script>
</body>
</html>
