<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Case Converter – AccessFreeTools</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>AccessFreeTools<span class="tld">.com</span></h1>
  </header>
  <main class="tool-page">
    <a class="back-link" href="/">&larr; All tools</a>
    <h2>Aa Text Case Converter</h2>
    <textarea id="input" rows="6" placeholder="Enter your text here…"></textarea>
    <div class="btn-row">
      <button data-fn="upper">UPPER CASE</button>
      <button data-fn="lower">lower case</button>
      <button data-fn="title">Title Case</button>
      <button data-fn="sentence">Sentence case</button>
      <button data-fn="camel">camelCase</button>
      <button data-fn="snake">snake_case</button>
      <button id="copyBtn">Copy result</button>
      <button id="clearBtn">Clear</button>
    </div>
    <div class="output">
      <textarea id="output" rows="6" readonly placeholder="Result will appear here…"></textarea>
    </div>
  </main>
  <script>
    const input  = document.getElementById('input');
    const output = document.getElementById('output');
    const transforms = {
      upper:    (s) => s.toUpperCase(),
      lower:    (s) => s.toLowerCase(),
      title:    (s) => s.replace(/\w\S*/g, (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()),
      sentence: (s) => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(),
      camel:    (s) => s.toLowerCase().replace(/[^a-zA-Z0-9]+(.)/g, (_, c) => c.toUpperCase()),
      snake:    (s) => s.toLowerCase().replace(/\s+/g, '_'),
    };
    document.querySelectorAll('[data-fn]').forEach((btn) => {
      btn.addEventListener('click', () => {
        output.value = transforms[btn.dataset.fn](input.value);
      });
    });
    document.getElementById('copyBtn').addEventListener('click', () => navigator.clipboard.writeText(output.value));
    document.getElementById('clearBtn').addEventListener('click', () => { input.value = ''; output.value = ''; });
  </script>
</body>
</html>
